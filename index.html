<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucky Wheel - By Catalog</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* พื้นหลังสีเขียวคริสต์มาสพรีเมียม */
      background: radial-gradient(circle at 50% 30%, #1b4332 0%, #081c15 80%, #040f0c 100%);
      font-family: 'Prompt', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 15px 20px 15px;
      position: relative;
    }

    /* ก้อนหิมะทรงปุยเมฆหนานุ่ม (Snow Clouds) */
    body::before {
      content: '';
      position: absolute;
      top: -20px;
      left: -5%;
      width: 110%;
      height: 95px;
      background: 
        radial-gradient(circle at 5% 20px, #ffffff 42px, transparent 43px),
        radial-gradient(circle at 18% 10px, #f8fafc 55px, transparent 56px),
        radial-gradient(circle at 32% 25px, #ffffff 48px, transparent 49px),
        radial-gradient(circle at 48% 12px, #f1f5f9 60px, transparent 61px),
        radial-gradient(circle at 64% 22px, #ffffff 50px, transparent 51px),
        radial-gradient(circle at 80% 10px, #f8fafc 58px, transparent 59px),
        radial-gradient(circle at 95% 25px, #ffffff 45px, transparent 46px);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45)) drop-shadow(0 2px 4px rgba(255, 255, 255, 0.8));
      z-index: 5;
      pointer-events: none;
    }

    /* เลเยอร์ละอองหิมะโปรยใต้ก้อนเมฆ */
    body::after {
      content: '';
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: 25px;
      background: 
        radial-gradient(circle at 8% 8px, #ffffff 4px, transparent 5px),
        radial-gradient(circle at 22% 14px, #ffffff 5px, transparent 6px),
        radial-gradient(circle at 38% 6px, #ffffff 4px, transparent 5px),
        radial-gradient(circle at 55% 12px, #ffffff 6px, transparent 7px),
        radial-gradient(circle at 72% 8px, #ffffff 4px, transparent 5px),
        radial-gradient(circle at 88% 16px, #ffffff 5px, transparent 6px);
      opacity: 0.85;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      z-index: 6;
      pointer-events: none;
    }

    #confetti-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 90;
    }

    /* ปุ่มเปิด/ปิดเพลงประกอบ */
    .audio-control-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.5);
      border: 1.5px solid #ffd700;
      color: #ffffff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    /* ส่วนหัว */
    .header-text {
      text-align: center;
      width: 100%;
      position: relative;
      z-index: 20;
      margin-top: 65px;
    }
    .header-text h1 {
      margin: 0;
      font-size: 1.7rem;
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 10px rgba(255,255,255,0.3);
      line-height: 1.2;
    }

    /* ป้ายพื้นหลังสีน้ำตาลพรีเมียมให้คำว่า BY CATALOG */
    .header-text .subtitle {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff8e1;
      background: linear-gradient(135deg, #4a2c11 0%, #3a1e08 100%);
      border: 1.5px solid #ffd700;
      border-radius: 12px;
      padding: 3px 14px;
      letter-spacing: 1px;
      margin-top: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.2);
    }

    .header-text .tagline {
      font-size: 0.85rem;
      font-weight: 500;
      color: #ffffff;
      margin-top: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    /* เวทีแสดงผลหลัก */
    .main-stage {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 360px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* ชุดประกอบวงล้อ */
    .wheel-assembly {
      position: absolute;
      left: 0px;
      bottom: 12px;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    /* เข็มชี้รางวัล */
    .wheel-pointer {
      position: absolute;
      top: -16px;
      z-index: 35;
      width: 30px;
      height: 36px;
      background: linear-gradient(135deg, #ff1744, #d50000);
      border: 2px solid #ffd700;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }

    /* กรอบไฟกระพริบสีทอง */
    .wheel-gold-frame {
      position: relative;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      padding: 9px;
      background: linear-gradient(135deg, #ffe082 0%, #ffd700 40%, #b8860b 70%, #fff8e1 85%, #daa520 100%);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6), 0 8px 25px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    .wheel-bulbs {
      position: absolute;
      inset: -9px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 25;
    }

    .bulb {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px #fff, 0 0 10px #ffd700;
      animation: bulbBlink 1s infinite alternate ease-in-out;
    }

    .bulb:nth-child(even) {
      background: #fff59d;
      animation-delay: 0.5s;
    }

    .b1 { top: 0%; left: 50%; transform: translate(-50%, -50%); }
    .b2 { top: 14.6%; right: 14.6%; transform: translate(50%, -50%); }
    .b3 { top: 50%; right: 0%; transform: translate(50%, -50%); }
    .b4 { bottom: 14.6%; right: 14.6%; transform: translate(50%, 50%); }
    .b5 { bottom: 0%; left: 50%; transform: translate(-50%, 50%); }
    .b6 { bottom: 14.6%; left: 14.6%; transform: translate(-50%, 50%); }
    .b7 { top: 50%; left: 0%; transform: translate(-50%, -50%); }
    .b8 { top: 14.6%; left: 14.6%; transform: translate(-50%, -50%); }

    @keyframes bulbBlink {
      0% { opacity: 0.3; transform: scale(0.8); box-shadow: 0 0 2px #ffd700; }
      100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #ffffff, 0 0 14px #ffd700; }
    }

    .wheel-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }

    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
    }

    .center-cap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff8e1 0%, #ffd700 40%, #b8860b 80%, #5c4300 100%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.8);
      z-index: 30;
      pointer-events: none;
    }

    /* ฐานพรีเมียมสีทอง */
    .wheel-stand-stem {
      width: 50px;
      height: 35px;
      margin-top: -6px;
      background: linear-gradient(180deg, #b8860b 0%, #ffd700 50%, #996515 100%);
      clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
      z-index: 15;
    }

    .wheel-stand-base {
      width: 135px;
      height: 30px;
      margin-top: -2px;
      background: linear-gradient(180deg, #ffe082 0%, #ffd700 40%, #b8860b 80%, #785202 100%);
      border-radius: 12px 12px 18px 18px;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.7);
      z-index: 15;
    }

    /* รูปแมวซานต้า */
    .cat-diecut-img {
      position: absolute;
      right: -25px;
      bottom: 8px;
      width: 175px;
      height: auto;
      z-index: 30;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
      pointer-events: none;
    }

    /* ปุ่มและกล่องคำพูด */
    .controls {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 60;
    }

    .cat-speech-bubble {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%) scale(0.4);
      background: #ffffff;
      color: #b71c1c;
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      z-index: 95;
      width: 85%;
      max-width: 270px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .cat-speech-bubble.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .cat-speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      right: 50px;
      border-width: 12px 9px 0 9px;
      border-style: solid;
      border-color: #ffd700 transparent transparent transparent;
      display: block;
      width: 0;
    }

    .spin-btn {
      width: 100%;
      max-width: 290px;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #d32f2f, #8e0000);
      border: 3px solid #ffd700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
      font-family: 'Prompt', sans-serif;
    }

    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .spin-btn:active {
      transform: scale(0.97);
    }

    .spin-btn:disabled {
      background: #424242;
      border-color: #757575;
      color: #9e9e9e;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <button id="audioBtn" class="audio-control-btn" title="เปิด/ปิด เสียงเพลง">🎵</button>

  <div class="header-text">
    <h1>🎄 LUCKY WHEEL 🎁</h1>
    <div class="subtitle">BY CATALOG</div>
    <div class="tagline">หมุนวงล้อรับของขวัญส่วนลดคริสต์มาส!</div>
  </div>

  <div class="main-stage">
    
    <div class="wheel-assembly">
      <div class="wheel-pointer"></div>
      <div class="wheel-gold-frame">
        <div class="wheel-bulbs">
          <div class="bulb b1"></div>
          <div class="bulb b2"></div>
          <div class="bulb b3"></div>
          <div class="bulb b4"></div>
          <div class="bulb b5"></div>
          <div class="bulb b6"></div>
          <div class="bulb b7"></div>
          <div class="bulb b8"></div>
        </div>
        <div class="wheel-wrapper">
          <canvas id="wheel" width="300" height="300"></canvas>
        </div>
        <div class="center-cap"></div>
      </div>
      <div class="wheel-stand-stem"></div>
      <div class="wheel-stand-base"></div>
    </div>

    <img src="S__2367492-removebg-preview.png" alt="Santa Cat" class="cat-diecut-img">

  </div>

  <div class="controls">
    <div id="catSpeech" class="cat-speech-bubble">
      โฮ่ โฮ่ โฮ่! ยินดีด้วยครับ 🎉<br>คุณได้รับ <span id="rewardText" style="color:#d32f2f; font-size:1.15rem; font-weight:800;">-</span>
    </div>

    <button id="spinBtn" class="spin-btn">🎁 หมุนรับโบนัสปีใหม่ 🎁</button>
  </div>

  <script>
    const wheelCanvas = document.getElementById('wheel');
    const confettiCanvas = document.getElementById('confetti-canvas');
    
    const ctx = wheelCanvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const catSpeech = document.getElementById('catSpeech');
    const rewardText = document.getElementById('rewardText');
    const audioBtn = document.getElementById('audioBtn');

    /* -------------------------------------------------------------
       AUDIO ENGINE (Web Audio API - Synthesizer)
    ------------------------------------------------------------- */
    let audioCtx = null;
    let musicInterval = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // เล่นตัวโน้ตเสียง Music Box (Sine Wave + Bell Decay)
    function playMusicBoxNote(freq, time, duration = 1.2) {
      if (!audioCtx || isMuted) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);

      gain.gain.setValueAtTime(0.18, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(time);
      osc.stop(time + duration);
    }

    // ทำนองเพลง Music Box คริสต์มาส (We Wish You a Merry Christmas Melody)
    const musicNotes = [
      { f: 261.63, d: 0.4 }, { f: 349.23, d: 0.4 }, { f: 349.23, d: 0.2 }, { f: 392.00, d: 0.2 },
      { f: 349.23, d: 0.2 }, { f: 329.63, d: 0.2 }, { f: 293.66, d: 0.4 }, { f: 293.66, d: 0.4 },
      { f: 392.00, d: 0.4 }, { f: 392.00, d: 0.2 }, { f: 440.00, d: 0.2 }, { f: 392.00, d: 0.2 },
      { f: 349.23, d: 0.2 }, { f: 329.63, d: 0.4 }, { f: 261.63, d: 0.4 }, { f: 440.00, d: 0.4 },
      { f: 440.00, d: 0.2 }, { f: 466.16, d: 0.2 }, { f: 440.00, d: 0.2 }, { f: 392.00, d: 0.2 },
      { f: 349.23, d: 0.4 }, { f: 293.66, d: 0.4 }, { f: 261.63, d: 0.2 }, { f: 261.63, d: 0.2 },
      { f: 293.66, d: 0.4 }, { f: 392.00, d: 0.4 }, { f: 329.63, d: 0.4 }, { f: 349.23, d: 0.8 }
    ];

    function startMusicBox() {
      if (musicInterval || isMuted) return;
      initAudio();

      let noteIdx = 0;
      let nextTime = audioCtx.currentTime + 0.1;

      function scheduleNotes() {
        while (nextTime < audioCtx.currentTime + 0.4) {
          const note = musicNotes[noteIdx];
          playMusicBoxNote(note.f, nextTime, 1.0);
          nextTime += note.d * 1.1; // ความเร็วของทำนอง
          noteIdx = (noteIdx + 1) % musicNotes.length;
        }
      }

      musicInterval = setInterval(scheduleNotes, 200);
    }

    function stopMusicBox() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
    }

    // เสียงเอฟเฟกต์รางวัลเมื่อหมุนเสร็จ (Win Fanfare / Tada Sound Effect)
    function playWinSound() {
      if (!audioCtx || isMuted) return;

      const now = audioCtx.currentTime;
      // คอร์ดฉลองความสำเร็จ (C Major Arpeggio Fanfare)
      const fanfareNotes = [
        { f: 523.25, t: 0.0, d: 0.2 },  // C5
        { f: 659.25, t: 0.12, d: 0.2 }, // E5
        { f: 783.99, t: 0.24, d: 0.2 }, // G5
        { f: 1046.50, t: 0.38, d: 1.2 } // C6 (ลากเสียงยาวโป๊ะเอฟเฟกต์)
      ];

      fanfareNotes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle'; // ให้เสียงสดใสเป็นประกาย
        osc.frequency.setValueAtTime(n.f, now + n.t);

        gain.gain.setValueAtTime(0.3, now + n.t);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + n.t);
        osc.stop(now + n.t + n.d);
      });
    }

    // สลับเปิด/ปิดเสียง
    audioBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      if (isMuted) {
        audioBtn.innerText = "🔇";
        stopMusicBox();
      } else {
        audioBtn.innerText = "🎵";
        startMusicBox();
      }
    });

    /* -------------------------------------------------------------
       WHEEL & LOGIC
    ------------------------------------------------------------- */
    const myConfetti = confetti.create(confettiCanvas, {
      resize: true,
      useWorker: true
    });

    const rewards = [
      { text: "5%", color: "#26a69a", weight: 40 },
      { text: "10%", color: "#fbc02d", weight: 30 },
      { text: "15%", color: "#ef5350", weight: 20 },
      { text: "20%", color: "#29b6f6", weight: 10 }
    ];

    const numSlices = rewards.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    let currentRotation = 0;
    let hasSpun = false;

    function drawWheel() {
      const canvasW = wheelCanvas.width;
      const canvasH = wheelCanvas.height;
      const centerX = canvasW / 2;
      const centerY = canvasH / 2;
      const radius = canvasW / 2;

      ctx.clearRect(0, 0, canvasW, canvasH);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle - Math.PI / 2;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = rewards[i].color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#ffffff";
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 34px 'Prompt', sans-serif";
        ctx.shadowColor = "rgba(0, 0, 0, 0.3)";
        ctx.shadowBlur = 4;
        ctx.fillText(rewards[i].text, radius - 25, 12);
        ctx.restore();
      }
    }

    function getRandomPrizeIndex() {
      const totalWeight = rewards.reduce((sum, item) => sum + item.weight, 0);
      let randomNum = Math.random() * totalWeight;

      for (let i = 0; i < rewards.length; i++) {
        if (randomNum < rewards[i].weight) {
          return i;
        }
        randomNum -= rewards[i].weight;
      }
      return 0;
    }

    function triggerConfetti() {
      myConfetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6, x: 0.3 },
        colors: ['#ffd700', '#ffffff', '#e53935', '#26a69a']
      });
      
      myConfetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6, x: 0.7 },
        colors: ['#ffd700', '#ffffff', '#e53935', '#26a69a']
      });
    }

    function spinWheel() {
      if (hasSpun) return;
      
      initAudio();
      startMusicBox();

      hasSpun = true;
      spinBtn.disabled = true;
      spinBtn.innerText = "กำลังสุ่มรางวัล...";
      
      catSpeech.classList.remove('active');
      myConfetti.reset(); 

      const prizeIndex = getRandomPrizeIndex();
      
      const degreesPerSlice = 360 / numSlices;
      const targetDegreeOnWheel = 360 - (prizeIndex * degreesPerSlice + degreesPerSlice / 2);
      
      const extraRounds = 360 * 5; 
      const currentMod = currentRotation % 360;
      const rotationNeeded = extraRounds + targetDegreeOnWheel - currentMod;
      currentRotation += rotationNeeded;

      wheelCanvas.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        spinBtn.innerText = "🔒 รับโบนัสเรียบร้อยแล้ว";
        rewardText.innerText = "ส่วนลด " + rewards[prizeIndex].text;
        catSpeech.classList.add('active');
        
        // เล่นเอฟเฟกต์เสียงรางวัลโป๊ะ! + Confetti
        playWinSound();
        triggerConfetti();
      }, 4000);
    }

    // เริ่มเพลงทันทีที่กดส่วนใดก็ได้บนหน้าจอครั้งแรก (Browser Policy)
    window.addEventListener('click', () => {
      initAudio();
      if (!isMuted && !musicInterval) {
        startMusicBox();
      }
    }, { once: true });

    drawWheel();
    spinBtn.addEventListener('click', spinWheel);
